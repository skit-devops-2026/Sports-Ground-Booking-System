<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup form</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    
    <header class="header">
        <div class="logo">
            <span>PlayBook</span>
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="Grounds.html">Grounds</a>
            <a href="Booking.html">Bookings</a>
            <a href="">Offers</a>
            <a href="javascript:void(0)" onclick="window.scrollTo({top: document.documentElement.scrollHeight, behavior: 'smooth'})">Contact</a>
        </nav>
        <div class="auth-buttons">
        <a href="login.html" class="login-btn">Login</a>
        <a href="signup.html" class="signup-btn">Sign Up</a>
    </div>
    </div>
</header>


    <main class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>
        <p>Join PlayBook and start booking your favourite grounds.</p>

        <form id="signupForm">

            <label>Full Name</label>
            <input type="text" id="signupName"
                   placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="signupEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword"
                   placeholder="Create a password" required>

            <button type="submit">Sign Up</button>

        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>

<!-- footer  -->

<footer class="footer">

    <div class="footer-container">

        <!-- Logo & About -->
        <div class="footer-section">
            <h2 class="footer-logo">⚽ PlayBook</h2>

            <p>
                Book your favourite sports grounds and
                turfs easily. Play more, worry less!
            </p>

            <div class="social-icons">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
            </div>
        </div>

    <script src="script.js"></script>

</body>
</html>
